<div class="login-container">
  <div class="login-box">
    <h1>Login</h1>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter username"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password"
          required
        />
      </div>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <p class="hint">Demo: username: <strong>test</strong>, password: <strong>1234</strong></p>
  </div>
</div>
